services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=portal_oportunidades'
      - 'POSTGRES_PASSWORD=portal'
      - 'POSTGRES_USER=portal'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portal -d portal_oportunidades']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: 'redis:8-alpine'
    ports:
      - '6379:6379'
