databaseChangeLog:
  - changeSet:
      id: 20261129-persisted-domain-catalogs
      author: backend-team
      changes:
        - sql:
            sql: |
              CREATE SCHEMA IF NOT EXISTS catalogo;
              CREATE TABLE catalogo.item (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                categoria VARCHAR(40) NOT NULL,
                codigo VARCHAR(60) NOT NULL,
                rotulo VARCHAR(120) NOT NULL,
                ativo BOOLEAN NOT NULL DEFAULT TRUE,
                CONSTRAINT uk_catalog_category_code UNIQUE (categoria, codigo),
                CONSTRAINT ck_catalog_category CHECK (categoria IN ('OPPORTUNITY_MODALITY','RECRUITER_TYPE')),
                CONSTRAINT ck_catalog_code CHECK (codigo ~ '^[A-Z][A-Z0-9_]*$')
              );
              INSERT INTO catalogo.item (categoria, codigo, rotulo) VALUES
                ('OPPORTUNITY_MODALITY','INTERNSHIP','Internship'),
                ('OPPORTUNITY_MODALITY','SCIENTIFIC_INITIATION','Scientific initiation'),
                ('OPPORTUNITY_MODALITY','TECHNOLOGICAL_INITIATION','Technological initiation'),
                ('OPPORTUNITY_MODALITY','EXTENSION','Extension'),
                ('OPPORTUNITY_MODALITY','SCHOLARSHIP','Scholarship'),
                ('OPPORTUNITY_MODALITY','OTHER','Other'),
                ('RECRUITER_TYPE','COMPANY','Company'),
                ('RECRUITER_TYPE','PROFESSOR','Professor'),
                ('RECRUITER_TYPE','ACADEMIC_LEAGUE','Academic league'),
                ('RECRUITER_TYPE','UNIVERSITY_DEPARTMENT','University department'),
                ('RECRUITER_TYPE','OTHER','Other');
              ALTER TABLE perfil.recrutador DROP CONSTRAINT IF EXISTS ck_recruiter_organization_required;
              ALTER TABLE oportunidades.oportunidade ALTER COLUMN modalidade TYPE VARCHAR(60) USING modalidade::text;
              ALTER TABLE perfil.recrutador ALTER COLUMN tipo TYPE VARCHAR(60) USING tipo::text;
              ALTER TABLE perfil.recrutador ADD CONSTRAINT ck_recruiter_organization_required CHECK (tipo = 'PROFESSOR' OR nome_organizacao IS NOT NULL);
              DROP TYPE oportunidades.modalidade_oportunidade;
              DROP TYPE perfil.tipo_recrutador;
      rollback:
        - sql:
            sql: |
              CREATE TYPE oportunidades.modalidade_oportunidade AS ENUM ('INTERNSHIP','SCIENTIFIC_INITIATION','TECHNOLOGICAL_INITIATION','EXTENSION','SCHOLARSHIP','OTHER');
              CREATE TYPE perfil.tipo_recrutador AS ENUM ('COMPANY','PROFESSOR','ACADEMIC_LEAGUE','UNIVERSITY_DEPARTMENT','OTHER');
              ALTER TABLE oportunidades.oportunidade ALTER COLUMN modalidade TYPE oportunidades.modalidade_oportunidade USING modalidade::oportunidades.modalidade_oportunidade;
              ALTER TABLE perfil.recrutador ALTER COLUMN tipo TYPE perfil.tipo_recrutador USING tipo::perfil.tipo_recrutador;
              DROP TABLE catalogo.item;
