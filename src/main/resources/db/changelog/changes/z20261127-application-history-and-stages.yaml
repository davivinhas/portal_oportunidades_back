databaseChangeLog:
  - changeSet:
      id: 20261127-application-status-history-and-selection-stages
      author: backend-team
      changes:
        - sql:
            sql: |
              CREATE TABLE oportunidades.historico_status_candidatura (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                candidatura_id BIGINT NOT NULL REFERENCES oportunidades.candidatura(id) ON DELETE CASCADE,
                status_anterior VARCHAR(30),
                status_novo VARCHAR(30) NOT NULL,
                alterado_em TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT ck_application_status_history_new CHECK (status_novo IN ('SUBMITTED','UNDER_REVIEW','APPROVED','REJECTED','CANCELLED')),
                CONSTRAINT ck_application_status_history_previous CHECK (status_anterior IS NULL OR status_anterior IN ('SUBMITTED','UNDER_REVIEW','APPROVED','REJECTED','CANCELLED'))
              );
              CREATE INDEX idx_application_status_history_application ON oportunidades.historico_status_candidatura(candidatura_id, alterado_em, id);
              CREATE TABLE oportunidades.etapa_seletiva_candidatura (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                candidatura_id BIGINT NOT NULL REFERENCES oportunidades.candidatura(id) ON DELETE CASCADE,
                nome VARCHAR(120) NOT NULL,
                ordem INTEGER NOT NULL,
                CONSTRAINT uk_application_stage_order UNIQUE (candidatura_id, ordem),
                CONSTRAINT ck_application_stage_order CHECK (ordem > 0)
              );
      rollback:
        - sql:
            sql: DROP TABLE oportunidades.etapa_seletiva_candidatura; DROP TABLE oportunidades.historico_status_candidatura;
